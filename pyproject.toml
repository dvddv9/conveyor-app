[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vishap-analyzer"
version = "6.0.2"
description = "Vishap - multi-material IT analyst (code, config, spec, logs, data). 6-stage LLM pipeline with SAST/SCA, SARIF 2.1.0, OWASP Top 10, audit trail (SHA-256), provenance, exploitability."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{name = "David (dvddv9)", email = "hndav9@yahoo.com"}]
keywords = ["vishap", "vishap-analyzer", "security", "sast", "sca", "sarif", "owasp", "llm", "multi-material", "code-review", "audit-trail", "compliance", "pii", "deepseek", "ollama"]

dependencies = [
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "ollama>=0.4.0",
    "openai>=1.50.0",
    "streamlit>=1.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "radon>=6.0.0",
    "tenacity>=9.2.0",
    "httpx>=0.27.0",
    "cyclonedx-bom>=7.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "black>=24.0.0"]

[project.scripts]
vishap = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "vishap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.setuptools.package-data]
vishap = ["*.md"]
