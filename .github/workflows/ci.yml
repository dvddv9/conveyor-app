name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vishap
          POSTGRES_PASSWORD: vishap_dev
          POSTGRES_DB: vishap
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dev tools
        run: pip install ruff pytest-asyncio

      - name: "Lint (ruff: F + E9)"
        run: ruff check src/ --config pyproject.toml

      - name: Run tests (sans e2e)
        run: python -m pytest tests/ --ignore=tests/test_e2e.py -q
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://vishap:vishap_dev@localhost:5432/vishap
          VISHAP_DATA_DIR: ${{ github.workspace }}/data

      - name: Check syntax (ast.parse)
        run: |
          python -c "import ast, pathlib; [ast.parse(f.read_text(encoding='utf-8')) for f in pathlib.Path('src').rglob('*.py')]; print('OK: all .py valid')"
