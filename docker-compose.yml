services:
  api:
    image: dvddv9/vishap-analyzer:6.0.2
    container_name: vishap-api
    ports:
      - "5001:5001"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - CONVEYOR_API_KEY=${CONVEYOR_API_KEY:-}
      - PORT=5001
      - VISHAP_DATA_DIR=/home/vishap/.vishap/data
    volumes:
      - vishap_data:/home/vishap/.vishap/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  ui:
    image: dvddv9/vishap-analyzer:6.0.2
    container_name: vishap-ui
    working_dir: /usr/local/lib/python3.12/site-packages
    command: python -m streamlit run src/ui/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:5001
      - CONVEYOR_API_KEY=${CONVEYOR_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: vishap-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - local-llm

volumes:
  vishap_data:
  ollama_data: