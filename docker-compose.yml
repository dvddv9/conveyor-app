services:
  api:
    image: dvddv9/vishap-analyzer:6.0.3
    container_name: vishap-api
    ports:
      - "5001:5001"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - CONVEYOR_API_KEY=${CONVEYOR_API_KEY:-}
      - PORT=5001
      - VISHAP_DATA_DIR=/home/vishap/.vishap/data
    volumes:
      - vishap_data:/home/vishap/.vishap/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  ui:
    image: dvddv9/vishap-analyzer:6.0.3
    container_name: vishap-ui
    working_dir: /usr/local/lib/python3.12/site-packages
    command: python -m streamlit run src/ui/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:5001
      - CONVEYOR_API_KEY=${CONVEYOR_API_KEY:-}
      - VISHAP_DATA_DIR=/home/vishap/.vishap/data
    volumes:
      - vishap_data:/home/vishap/.vishap/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8501/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    container_name: vishap-postgres
    environment:
      POSTGRES_DB: vishap
      POSTGRES_USER: vishap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vishap_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vishap"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: vishap-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - local-llm

  redis:
    image: redis:7-alpine
    container_name: vishap-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: .
    container_name: vishap-worker
    command: celery -A src.api.celery_app worker --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - VISHAP_DATA_DIR=/data
    volumes:
      - vishap_data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  vishap_data:
  ollama_data:
  postgres_data: